name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: npx @tauri-apps/cli build

      - name: Prepare all release assets
        run: node scripts/prepare-release-assets.js

      - name: Publish GitHub Release with all assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nexus ${{ github.ref_name }}
          body: |
            ## Nexus ${{ github.ref_name }} - Release Completa

            - **Instalador Windows (Setup .exe / MSI)**
            - **Versão Portátil (.exe / .zip)**
            - **Atualização Automática (latest.yml + latest.json)**
          files: |
            releases/release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}