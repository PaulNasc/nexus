<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Gerenciador de Tarefas</title>
    <meta name="description" content="Sistema desktop de gerenciamento de tarefas com IA integrada">
    
    <!-- Prevent favicon.ico 404 error -->
    <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
    
    <!-- Styles will be imported via JavaScript -->
    
    <!-- Content Security Policy - Relaxed for development -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https: file: blob: asset: http://asset.localhost https://asset.localhost;
        media-src 'self' file: blob: asset: http://asset.localhost https://asset.localhost http://localhost:*;
        frame-src 'self' file: blob: data: asset: http://asset.localhost http://localhost:* https:;
        font-src 'self';
        connect-src 'self' ws: wss: http: https:;
    ">
    
    <!-- Global polyfill - Must be first -->
    <script>
        // Simple global definition
        window.global = window.global || globalThis;
    </script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
